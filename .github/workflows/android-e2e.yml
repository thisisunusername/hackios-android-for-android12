name: HackiOS iOS 27 重构 · 云端 E2E
# 说明：本仓库未内置任何密钥。CI 中用仓库 Secrets 注入：
#   MAESTRO_API_KEY       Maestro Cloud 的 API key
#   GOOGLE_APPLICATION_CREDENTIALS / GCP_SA_KEY  Firebase Test Lab 的服务账号
# 没有密钥时，workflow 只跑「构建 + 单元测试」，不会伪造通过结果。

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  # GitHub Actions 不允许在 job 级 if 里读 secrets（secrets 上下文在 job 级不可用），
  # 所以先用一个 step 把「有没有密钥」写进 job outputs，后续 job 用 needs.*.outputs 判断。
  preflight:
    runs-on: ubuntu-latest
    outputs:
      maestro: ${{ steps.check.outputs.maestro }}
      gcp: ${{ steps.check.outputs.gcp }}
    steps:
      - id: check
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "maestro=$([ -n "$MAESTRO_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "gcp=$([ -n "$GCP_SA_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-and-unit-test:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 仓库里 .gitignore 排除了 5 个二进制资产（qemu 包 / 工具链 / 内核 / UEFI / VARS），
      # 不补回来 APK 只有 ~80MB，装上去 AssetDeployer 会报资源缺失、QEMU 根本起不来。
      # 上游 v0.30 的 debug APK（~180MB）里正好带着这几份，直接从里面抽出来即可。
      - name: Restore HackiOS 0.4 runtime assets from upstream APK
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o upstream.apk \
            https://github.com/hmascs/hackios-android/releases/download/v0.4/HackiOS-0.4.apk
          for f in qemu-android-bundle.zip hackios-toolchain.zip mach.development.bcm2837 \
                   QEMU_EFI.fd QEMU_VARS.fd hackios-scripts.zip loader.efi unzbm-probe.zip; do
            unzip -o -j upstream.apk "assets/$f" -d app/src/main/assets
          done
          # 0.4 换了 guest 内核（0.30 的 bcm2837 与 0.4 的 XNU 不是同一份），这里守住哈希，
          # 免得悄悄拿旧内核跑新镜像。
          check() { printf "%s  %s\n" "$2" "app/src/main/assets/$1" | sha256sum -c - ; }
          check mach.development.bcm2837 7b1f908324fa1315
          check QEMU_EFI.fd 5f8ef96257f27e28
          check QEMU_VARS.fd 3b6a07d0
          check qemu-android-bundle.zip 52f4d832
          check hackios-toolchain.zip c8cb0793
          ls -lh app/src/main/assets

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK platform 37 + build-tools 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0" \
            || sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Add Execute Permission to Gradlew
        run: chmod 755 -R /home/runner
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # -PgpuTest=true 才会把 remoteGL/Turnip 运行时（app/src/gpuTest/assets）打进包，
      # 缺这个 flag 出来的是纯 OSMesa 软件包。
      - name: Assemble debug APK (GPU test variant)
        run: ./gradlew :app:assembleDebug -PgpuTest=true -PgpuAssetsDir="$PWD/app/src/gpuTest/assets"

      - name: Assemble release APK (R8, GPU test variant)
        run: ./gradlew :app:assembleRelease -PgpuTest=true -PgpuAssetsDir="$PWD/app/src/gpuTest/assets"

      - name: Assemble androidTest APK
        run: ./gradlew :app:assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

  # 每次 main 上的构建成功后自动发 Release：把 debug APK 挂到 v0.30.<run_number> 上。
  # 用 debug APK 是因为 release 变体没有签名配置，产物是 unsigned、装不上；
  # 等以后在仓库 Secrets 配了签名，再把这里换成 release APK 即可。
  release:
    needs: build-and-unit-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks

      - name: Collect installable APK
        run: |
          mkdir -p release
          find apks -name 'app-debug.apk' -exec cp {} release/ \;
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: HackiOS Android 12 · 0.4.${{ github.run_number }}
          body: |
            自动构建的 debug APK（基于上游 0.4 源码，minSdk 31 / Android 12+，targetSdk 28）。

            含实验性 Adreno GPU 后端（remoteGL + Turnip/Zink，需 Adreno 8xx；设备页「驱动」里切换，默认仍是 OSMesa）。首次运行需要授予「所有文件访问」。
          files: release/*.apk
          generate_release_notes: true
          make_latest: true

  maestro-cloud:
    needs: [ preflight, build-and-unit-test ]
    if: needs.preflight.outputs.maestro == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: artifacts
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Upload app to Maestro Cloud and run flows
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}
        run: |
          ~/.maestro/bin/maestro cloud \
            --api-key "$MAESTRO_API_KEY" \
            --app-file artifacts/app-debug.apk \
            --device-model "Pixel 7" \
            --android-api-level 34 \
            --output artifacts/maestro-report \
            .maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: artifacts/maestro-report

  firebase-test-lab:
    needs: [ preflight, build-and-unit-test ]
    if: needs.preflight.outputs.gcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: artifacts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run instrumentation on API 33 / 34 / 35
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app artifacts/app-debug.apk \
            --test artifacts/app-debug-androidTest.apk \
            --device model=oriole,version=33,locale=zh_CN \
            --device model=oriole,version=34,locale=zh_CN \
            --device model=shiba,version=35,locale=zh_CN \
            --use-orchestrator \
            --timeout 30m \
            --results-bucket "gs://${{ secrets.GCP_RESULTS_BUCKET }}" \
            --results-dir "hackios-${{ github.run_id }}"
      - name: Fetch artifacts (screenshots, logcat, semantics)
        if: always()
        run: |
          mkdir -p artifacts/ftl
          gsutil -m cp -r "gs://${{ secrets.GCP_RESULTS_BUCKET }}/hackios-${{ github.run_id }}/*" artifacts/ftl/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftl-results
          path: artifacts/ftl
